name: Deploy PPE (opus)

# On push to `ppe`, the self-hosted runner on opus (label `opus`, running as the
# `deploy` user) mirrors the branch into the nginx docroot. The shared staging
# nginx (infra: opus:/opt/www) serves it live from the bind mount — no restart.
#
# Note: functions/ is a Cloudflare Pages Function and is excluded — the contact
# form endpoint does not exist on the PPE host.

on:
  push:
    branches: [ppe]
  workflow_dispatch:

concurrency:
  group: ppe-opus-lastfallback
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, opus]
    steps:
      - name: Checkout ppe
        uses: actions/checkout@v4

      - name: Sync ppe -> /var/www/ppe.lastfallback.org/html
        run: |
          set -euo pipefail
          DEST=/var/www/ppe.lastfallback.org/html
          mkdir -p "$DEST"
          # Mirror the site; drop repo plumbing, docs, and Cloudflare/cPanel-only files.
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='.gitignore' \
            --exclude='.DS_Store' --exclude='.cpanel.yml' --exclude='functions' \
            --exclude='README.md' --exclude='CLAUDE.md' --exclude='LICENSE.md' \
            --exclude='LINUX_SETUP.md' \
            ./ "$DEST/"
          echo "Deployed $GITHUB_SHA -> $DEST"
